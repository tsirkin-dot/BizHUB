name: Build and verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Generate the site
        run: node src/build.mjs dist pretty
        env:
          SITE_ORIGIN: ${{ vars.SITE_ORIGIN || 'https://bizdraft.com' }}

      - name: Verify links, metadata and retrieval budgets
        run: node src/verify.mjs dist

      - name: Fail if the committed build is stale
        run: |
          node src/build.mjs . pretty
          if [ -n "$(git status --porcelain -- . ':(exclude)dist')" ]; then
            echo "The committed HTML does not match src/. Run: node src/build.mjs . pretty"
            git status --porcelain -- . ':(exclude)dist'
            exit 1
          fi

      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
